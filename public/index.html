<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AsifBhai Bot</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071026;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:520px;margin:auto;padding:18px}.hero{padding:22px;border-radius:24px;background:linear-gradient(145deg,#101b3e,#11102c);box-shadow:0 10px 30px #0008}
.badge{display:inline-block;background:#073b35;color:#19f5a5;padding:7px 12px;border-radius:20px;font-size:13px}
h1{margin:12px 0 4px;color:#16f0b1} .sub{color:#aab4cf}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.card{background:#121c3c;border:1px solid #26345d;border-radius:18px;padding:16px}.num{font-size:27px;font-weight:700}.label{font-size:12px;color:#8290b4;margin-top:5px}
.section{margin-top:15px}.bar{height:10px;background:#273151;border-radius:10px;overflow:hidden}.fill{height:100%;width:62%;background:#10ddb0;border-radius:10px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn{padding:13px;border:0;border-radius:14px;background:#17264d;color:white;font-weight:600}
.footer{text-align:center;color:#6f7b9c;margin:20px 0;font-size:12px}
</style>
</head>
<body><div class="wrap"><div class="hero">
<span class="badge">● LIVE</span><h1>⚡ AsifBhai Bot ⚡</h1><div class="sub">v1.0 • Ultra Performance</div>
<div class="grid">
<div class="card"><div class="num" id="users">0</div><div class="label">USERS</div></div>
<div class="card"><div class="num" id="online">1</div><div class="label">ONLINE</div></div>
<div class="card"><div class="num" id="commands">0</div><div class="label">COMMANDS</div></div>
<div class="card"><div class="num" id="uptime">0s</div><div class="label">UPTIME</div></div>
</div>
<div class="section card"><b>🟢 SYSTEM STATUS</b><p>Memory</p><div class="bar"><div class="fill" id="mem"></div></div><p class="sub" id="platform">Platform: —</p></div>
<div class="buttons"><button class="btn" onclick="cmd('ping')">📡 Ping</button><button class="btn" onclick="cmd('stats')">📊 Stats</button><button class="btn" onclick="cmd('menu')">📋 Menu</button><button class="btn" onclick="cmd('owner')">👑 Owner</button></div>
<div class="footer">🔒 AsifBhai Bot • Local dashboard</div>
</div></div>
<script>
async function refresh(){let d=await fetch('/api/stats').then(r=>r.json());
users.textContent=d.users;online.textContent=d.online;commands.textContent=d.commands;
uptime.textContent=d.uptime+'s';platform.textContent='Platform: '+d.platform;
mem.style.width=Math.min(95,Math.max(8,d.memory/1048576/3))+'%'}
async function cmd(c){await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:c})});refresh()}
refresh();setInterval(refresh,2000);
</script></body></html>
